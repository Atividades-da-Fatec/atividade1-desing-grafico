            <section class="separar">
                <div>
                    <form class="formulario-contato">

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="voce@email">
                        </div>

                        <div class="form-group">
                            <label for="">Assunto</label>
                            <input type="text" class="form-control" id="" placeholder="Assunto">
                        </div>

                        <div class="form-group">
                            <label for="">Descrição</label>
                            <textarea class="form-control" id="descricao" placeholder="descreva sua ideia"></textarea>
                        </div>

                        <button type="submit" class="btn btn-dark">Enviar</button>
                    </form>
                </div>
            

                <aside>
                    <div class="grande-cards">
                        <div class="caixacontato">

                        <div class="caixacontato">

                        </div>

                        <div class="caixacontato">
                            <h3>E-mail</h3>
                            <p>contato@tintaaco.com</p>
                        </div>

                        <div class="caixacontato">
                            <h3>Endereço</h3>
                            <p>AVENIDA RUA CIDADE-SP</p>
                        </div>
