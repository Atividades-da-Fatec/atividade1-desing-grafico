{% extends "base.html" %}
{% block content %}

<section class="layout-contato">
    <div>
        <form class="formulario-contato">

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="voce@email">
            </div>

            <div class="mb-3">
                <label for="assunto" class="form-label">Assunto</label>
                <input type="text" class="form-control" id="assunto" placeholder="Assunto">
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control campo-descricao" id="descricao" placeholder="descreva sua ideia"></textarea>
            </div>

            <button type="submit" class="btn btn-tatuagem">Enviar</button>
        </form>
    </div>


    <aside>
        <div class="grade-contatos">
            <div class="caixa-contato">
                <h3> WhatsApp</h3>
                <p>(12) 99999-9999</p>
            </div>

            <div class="caixa-contato">
                <h3>Instagram</h3>
                <p>@user_instagram</p>
            </div>

            <div class="caixa-contato">
                <h3>E-mail</h3>
                <p>contato@tintaaco.com</p>
            </div>

            <div class="caixa-contato">
                <h3>Endereço</h3>
                <p>AVENIDA RUA CIDADE-SP</p>
            </div>
        </div>
    </aside>
</section>

{% endblock %}
